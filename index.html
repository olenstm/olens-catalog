<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OLENS 카탈로그</title>
<style>
  :root{
    --bg:#FAF7F5; --ink:#2A2523; --ink-soft:#7A716C; --line:#E9E1DC;
    --accent:#C4707A; --accent-deep:#8F4A56; --accent-soft:#F2DCDF;
    --panel:#FFFFFF; --lens:#B9CFE0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;
    background:var(--bg); color:var(--ink); overflow:hidden;
    -webkit-tap-highlight-color: transparent;
  }
  #app{display:flex; height:100vh; width:100vw;}

  #sidebar{width:76px; min-width:76px; background:#FFFFFF; border-right:1px solid var(--line); display:flex; flex-direction:column; align-items:center; padding-top:20px;}
  #sidebar .logo-img{width:56px; height:auto; margin-bottom:6px;}

  #sync-status{margin-top:auto; font-size:9px; color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:4px; padding:0 6px; text-align:center;}
  #sync-status2{margin-bottom:16px; font-size:9px; color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; gap:4px; padding:0 6px; text-align:center;}
  #sync-status .dot, #sync-status2 .dot{width:7px; height:7px; border-radius:50%; background:#C9C0BB;}
  #sync-status.ok .dot, #sync-status2.ok .dot{background:#6FAE7F;}
  #sync-status.err .dot, #sync-status2.err .dot{background:#C4707A;}

  #main{flex:1; display:flex; overflow:hidden;}

  #list-col{width:300px; min-width:260px; display:flex; flex-direction:column; overflow:hidden; border-right:1px solid var(--line);}

  /* ---------- 보기 모드 탭 (연예인별 / 제품별) ---------- */
  #mode-tabs{display:flex; border-bottom:1px solid var(--line);}
  .mode-btn{flex:1; padding:13px 0; text-align:center; font-size:12.5px; font-weight:700; color:var(--ink-soft); background:var(--panel); border:none; cursor:pointer; border-bottom:2.5px solid transparent;}
  .mode-btn.active{color:var(--accent-deep); border-bottom-color:var(--accent); background:var(--accent-soft);}

  #topbar{padding:14px 20px 12px; border-bottom:1px solid var(--line);}
  #topbar h1{font-size:15px; font-weight:700; margin-bottom:8px;}
  #search{width:100%; padding:9px 14px; border-radius:18px; border:1px solid var(--line); font-size:12.5px; background:var(--bg); color:var(--ink); outline:none;}
  #search:focus{border-color:var(--accent);}
  #count{font-size:11px; color:var(--ink-soft); margin-top:6px; display:block;}

  #grid{flex:1; overflow-y:auto; padding:10px 20px 40px; display:flex; flex-direction:column; gap:0;}
  .row{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 12px; background:var(--panel);
    border:1px solid var(--line); border-bottom:none;
    cursor:pointer; transition:background .12s ease;
  }
  .row:first-child{border-radius:8px 8px 0 0;}
  .row:last-child{border-bottom:1px solid var(--line); border-radius:0 0 8px 8px;}
  .row:only-child{border-radius:8px;}
  .row:hover{background:var(--accent-soft);}
  .row.selected{background:var(--accent-soft); border-color:var(--accent);}
  .row .names{display:flex; flex-direction:column;}
  .row .group{font-size:9px; color:var(--ink-soft);}
  .row .member{font-size:12.5px; font-weight:700; color:var(--ink);}
  .row .rmeta{display:flex; align-items:center; gap:5px;}
  .row .ccount{font-size:8.5px; color:var(--ink-soft);}
  .row .arrow{font-size:10px; color:var(--ink-soft);}
  #empty{padding:60px 20px; text-align:center; color:var(--ink-soft); font-size:13px;}

  #detail-col{flex:1; overflow-y:auto; padding:26px 34px 60px;}
  #detail-empty{height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; color:var(--ink-soft); font-size:13px; text-align:center;}
  #detail-empty .big{font-size:32px; opacity:0.4;}

  #detail-head{margin-bottom:22px;}
  #detail-head .eyebrow{font-size:12.5px; color:var(--accent-deep); font-weight:700;}
  #detail-head .title{font-size:22px; font-weight:800; margin-top:2px;}
  #detail-head .pmeta{font-size:12px; color:var(--ink-soft); margin-top:6px;}

  #usage-notice{
    margin-top:14px; padding:10px 14px; border-radius:10px;
    background:var(--accent-soft); border:1px solid #E7BFC4;
    color:var(--accent-deep); font-size:11px; line-height:1.5;
  }

  .photo-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:14px;}
  .photo-card{display:flex; flex-direction:column; gap:6px;}
  .photo-slot{aspect-ratio:3/4; border-radius:14px; overflow:hidden; cursor:zoom-in; background:repeating-linear-gradient(135deg, var(--accent-soft), var(--accent-soft) 10px, #fff 10px, #fff 20px); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; color:var(--accent-deep); font-size:11px; font-weight:600; border:1.5px dashed #D9AEB4;}
  .photo-slot.has-photo{border:1px solid var(--line);}
  .photo-slot img{width:100%; height:100%; object-fit:cover; transition:transform .2s ease;}
  .photo-slot.has-photo:hover img{transform:scale(1.04);}
  .photo-caption{font-size:11.5px; font-weight:600; color:var(--ink); text-align:center;}
  .photo-caption .sub{display:block; font-size:10px; color:var(--ink-soft); font-weight:400; margin-top:1px;}

  #lightbox{position:fixed; inset:0; background:rgba(15,10,10,0.92); display:none; align-items:center; justify-content:center; z-index:100; padding:30px;}
  #lightbox.open{display:flex;}
  #lightbox-inner{display:flex; align-items:stretch; gap:0; max-width:1100px; max-height:88vh; width:100%; background:#111; border-radius:16px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.5);}
  #lightbox-img-wrap{flex:1; display:flex; align-items:center; justify-content:center; background:#0d0d0d; min-width:0; cursor:zoom-out;}
  #lightbox-img-wrap img{max-width:100%; max-height:88vh; object-fit:contain;}
  #lightbox-panel{width:380px; min-width:280px; background:var(--panel); padding:26px 22px; display:flex; flex-direction:column; overflow-y:auto;}
  #lightbox-panel .lp-label{font-size:11px; font-weight:700; color:var(--accent-deep); letter-spacing:0.5px; text-transform:uppercase; margin-bottom:8px;}
  #lightbox-panel .lp-name{font-size:18px; font-weight:800; color:var(--ink); margin-bottom:18px; line-height:1.3;}
  #lp-table{width:100%; border-collapse:collapse; font-size:15px;}
  #lp-table th{text-align:left; font-size:12.5px; font-weight:700; color:var(--ink-soft); padding:0 6px 10px; border-bottom:1.5px solid var(--line);}
  #lp-table td{padding:12px 6px; border-bottom:1px solid var(--line); color:var(--ink); vertical-align:top;}
  #lp-table tr:last-child td{border-bottom:none;}
  #lp-table td.cycle{font-weight:700; color:var(--accent-deep); white-space:nowrap;}
  .lp-empty{font-size:12px; color:var(--ink-soft); line-height:1.6;}
  #lightbox-notice{margin-top:auto; padding-top:16px; border-top:1px solid var(--line); font-size:10.5px; line-height:1.5; color:var(--ink-soft);}
  #lightbox-close{position:absolute; top:24px; right:28px; width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,0.15); color:#fff; font-size:18px; cursor:pointer; z-index:2;}
  #lightbox-close:hover{background:rgba(255,255,255,0.28);}

  @media (max-width:720px){
    #lightbox-inner{flex-direction:column; max-height:92vh;}
    #lightbox-panel{width:100%; min-width:0;}
    #lightbox-img-wrap img{max-height:45vh;}
  }

  @media (max-width:900px){
    #main{flex-direction:column;}
    #list-col{width:100%; min-width:0; max-height:42vh; border-right:none; border-bottom:1px solid var(--line);}
    #detail-col{padding:20px;}
  }
</style>
</head>

let mode = "celeb"; // "celeb" | "product"
let query = "";
let selectedKey = null;
let PHOTO_MAP = {}; // { folder: [{id, name}] }
let LIVE_CELEBS = CELEBS.slice();
let PRODUCT_MAP = {}; // { productName: [{folder, photo:{id,name}}] }

function driveThumb(id, size){ return `https://drive.google.com/thumbnail?id=${id}&sz=w${size}`; }

function normalizeForMatch(s){
  return (s || "")
    .replace(/원데이/g, "")
    .replace(/[\ufeff\u200b\u00a0\s]/g, "") // BOM, zero-width space, nbsp, 일반 공백 모두 제거
    .trim();
}
function productInfoFor(name){
  const key = normalizeForMatch(name);
  return PRODUCT_INFO_MAP[key] || null;
}

async function loadProductInfo(){
  const statusEl = document.getElementById("sync-status2");
  const textEl = document.getElementById("sync-text2");
  try{
    const res = await fetch(PRODUCT_API_URL + "?t=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("응답 오류: " + res.status);
    const map = await res.json();
    PRODUCT_INFO_MAP = map;
    const rowCount = Object.values(map).reduce((s,arr)=>s+arr.length, 0);
    statusEl.className = "ok";
    textEl.textContent = `제품 ${rowCount}건 연결됨`;
  }catch(err){
    statusEl.className = "err";
    textEl.textContent = "제품정보 연결 실패";
    console.error("제품정보 API 로드 실패", err);
  }
}

function parseFolderName(folder){
  const idx = folder.indexOf("_");
  if(idx === -1) return {group:"", member:folder, folder};
  return {group:folder.slice(0,idx), member:folder.slice(idx+1), folder};
}

function celebByFolder(folder){
  return LIVE_CELEBS.find(c=>c.folder===folder) || parseFolderName(folder);
}

// 파일명 끝의 "_1", "-2", "(3)" 같은 중복 구분 접미사를 떼어내 제품명으로 그룹핑
function baseProductName(name){
  return name.replace(/[\s_\-]?\(?\d+\)?$/,"").trim() || name;
}

function buildProductMap(){
  const map = {};
  Object.keys(PHOTO_MAP).forEach(folder=>{
    PHOTO_MAP[folder].forEach(photo=>{
      const key = baseProductName(photo.name);
      if(!map[key]) map[key] = [];
      map[key].push({folder, photo});
    });
  });
  return map;
}

async function loadPhotos(){
  const statusEl = document.getElementById("sync-status");
  const textEl = document.getElementById("sync-text");
  try{
    const res = await fetch(API_URL + "?t=" + Date.now(), {cache: "no-store"});
    if(!res.ok) throw new Error("응답 오류");
    PHOTO_MAP = await res.json();

    const knownByFolder = {};
    CELEBS.forEach(c => { knownByFolder[c.folder] = c; });
    LIVE_CELEBS = Object.keys(PHOTO_MAP).map(folder => knownByFolder[folder] || parseFolderName(folder));
    const extraFolders = Object.keys(PHOTO_MAP).filter(f => !knownByFolder[f]);
    PRODUCT_MAP = buildProductMap();

    const total = Object.values(PHOTO_MAP).reduce((s,arr)=>s+arr.length,0);
    statusEl.className = "ok";
    textEl.textContent = `${total}장 연결됨` + (extraFolders.length ? ` (신규 ${extraFolders.length}명)` : "");
  }catch(err){
    statusEl.className = "err";
    textEl.textContent = "연결 실패";
    console.error(err);
  }
  renderGrid();
}

function photosFor(c){ return PHOTO_MAP[c.folder] || []; }

function setMode(m){
  mode = m;
  selectedKey = null;
  query = "";
  document.getElementById("search").value = "";
  document.getElementById("tab-celeb").classList.toggle("active", m==="celeb");
  document.getElementById("tab-product").classList.toggle("active", m==="product");
  document.getElementById("list-title").textContent = m==="celeb" ? "연예인 (가나다순)" : "제품 (가나다순)";
  document.getElementById("search").placeholder = m==="celeb" ? "이름 또는 그룹 검색" : "제품명 검색";
  document.getElementById("detail-empty").style.display = "flex";
  document.getElementById("detail-content").style.display = "none";
  renderGrid();
}
document.getElementById("tab-celeb").onclick = () => setMode("celeb");
document.getElementById("tab-product").onclick = () => setMode("product");

function renderGrid(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  if(mode === "celeb"){
    let items = LIVE_CELEBS.slice();
    if(query.trim()){
      const q = query.trim().toLowerCase();
      items = items.filter(c => (c.group+c.member).toLowerCase().includes(q));
    }
    items.sort((a,b)=> a.member.localeCompare(b.member, 'ko'));
    document.getElementById("count").textContent = `${items.length}명`;
    if(items.length===0){ grid.innerHTML = `<div id="empty">검색 결과가 없습니다.</div>`; return; }

    items.forEach(c=>{
      const photos = photosFor(c);
      const row = document.createElement("div");
      row.className = "row" + (c.folder===selectedKey ? " selected" : "");
      row.innerHTML = `
        <span class="names">
          ${c.group ? `<span class="group">${c.group}</span>` : ""}
          <span class="member">${c.member}</span>
        </span>
        <span class="rmeta">
          <span class="ccount">${photos.length ? photos.length+"장" : "준비중"}</span>
          <span class="arrow">›</span>
        </span>`;
      row.onclick = () => selectCeleb(c);
      grid.appendChild(row);
    });
  } else {
    let names = Object.keys(PRODUCT_MAP);
    if(query.trim()){
      const q = query.trim().toLowerCase();
      names = names.filter(n => n.toLowerCase().includes(q));
    }
    names.sort((a,b)=> a.localeCompare(b, 'ko'));
    document.getElementById("count").textContent = `${names.length}개 제품`;
    if(names.length===0){ grid.innerHTML = `<div id="empty">검색 결과가 없습니다.</div>`; return; }

    names.forEach(name=>{
      const entries = PRODUCT_MAP[name];
      const celebCount = new Set(entries.map(e=>e.folder)).size;
      const row = document.createElement("div");
      row.className = "row" + (name===selectedKey ? " selected" : "");
      row.innerHTML = `
        <span class="names"><span class="member">${name}</span></span>
        <span class="rmeta">
          <span class="ccount">${celebCount}명 착용</span>
          <span class="arrow">›</span>
        </span>`;
      row.onclick = () => selectProduct(name);
      grid.appendChild(row);
    });
  }
}

function openDetailShell(eyebrow, title, meta){
  document.getElementById("detail-empty").style.display = "none";
  document.getElementById("detail-content").style.display = "block";
  document.getElementById("d-eyebrow").textContent = eyebrow;
  document.getElementById("d-title").textContent = title;
  document.getElementById("d-meta").textContent = meta;
  document.getElementById("detail-col").scrollTop = 0;
}

function selectCeleb(c){
  selectedKey = c.folder;
  renderGrid();
  const photos = photosFor(c);
  openDetailShell(c.group || "", c.member, `사진 ${photos.length}장`);

  const pg = document.getElementById("photo-grid");
  pg.innerHTML = "";
  if(photos.length === 0){
    pg.innerHTML = `<div class="photo-slot"><span>🖼️</span><span>사진 준비중<br>(${c.folder})</span></div>`;
  }else{
    photos.forEach(ph=>{
      const card = document.createElement("div");
      card.className = "photo-card";
      card.innerHTML = `
        <div class="photo-slot has-photo"><img src="${driveThumb(ph.id,800)}" loading="lazy"></div>
        <div class="photo-caption">${baseProductName(ph.name)}</div>`;
      card.querySelector(".photo-slot").onclick = () => openLightbox(driveThumb(ph.id,1600), baseProductName(ph.name));
      pg.appendChild(card);
    });
  }
}

function selectProduct(name){
  selectedKey = name;
  renderGrid();
  const entries = PRODUCT_MAP[name];
  const celebCount = new Set(entries.map(e=>e.folder)).size;
  openDetailShell("제품", name, `${celebCount}명 착용 · 사진 ${entries.length}장`);

  const pg = document.getElementById("photo-grid");
  pg.innerHTML = "";
  entries.forEach(e=>{
    const c = celebByFolder(e.folder);
    const card = document.createElement("div");
    card.className = "photo-card";
    card.innerHTML = `
      <div class="photo-slot has-photo"><img src="${driveThumb(e.photo.id,800)}" loading="lazy"></div>
      <div class="photo-caption">${c.member}${c.group ? `<span class="sub">${c.group}</span>` : ""}</div>`;
    card.querySelector(".photo-slot").onclick = () => openLightbox(driveThumb(e.photo.id,1600), name);
    pg.appendChild(card);
  });
}

function fmtPriceStr(price){
  if(!price) return "가격 문의";
  return price.split("/").map(p=>{
    const n = parseInt(p.replace(/[^0-9]/g,""), 10);
    return isNaN(n) ? p.trim() : n.toLocaleString() + "원";
  }).join(" / ");
}

function openLightbox(url, productName){
  document.getElementById("lightbox-img").src = url;
  document.getElementById("lp-name").textContent = productName || "-";

  const wrap = document.getElementById("lp-variants");
  wrap.innerHTML = "";
  const variants = productInfoFor(productName);
  if(!variants){
    const key = normalizeForMatch(productName);
    const totalKeys = Object.keys(PRODUCT_INFO_MAP).length;
    wrap.innerHTML = `<div class="lp-empty">등록된 제품정보가 없습니다.<br>(제품명 매칭 필요)<br><br>
      <b>진단정보</b><br>
      찾으려던 키: "${key}"<br>
      현재 로드된 제품 키 개수: ${totalKeys}${totalKeys===0 ? " (시트 연결 자체가 안 됨)" : ""}</div>`;
  }else{
    const rows = variants.map(v => `
      <tr>
        <td class="cycle">${v.cycle || "-"}</td>
        <td>${v.diameter ? v.diameter+"mm" : "-"}</td>
        <td>${fmtPriceStr(v.price)}</td>
        <td>${v.pack || "-"}</td>
      </tr>`).join("");
    wrap.innerHTML = `
      <table id="lp-table">
        <thead><tr><th>주기</th><th>직경</th><th>가격</th><th>개입수</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }
  document.getElementById("lightbox").classList.add("open");
}
function closeLightbox(){
  document.getElementById("lightbox").classList.remove("open");
  document.getElementById("lightbox-img").src = "";
}
document.getElementById("lightbox-close").onclick = closeLightbox;
document.getElementById("lightbox").addEventListener("click", (e)=>{ if(e.target.id==="lightbox") closeLightbox(); });
document.getElementById("lightbox-img-wrap").addEventListener("click", closeLightbox);

document.getElementById("search").addEventListener("input", (e)=>{ query = e.target.value; renderGrid(); });

renderGrid();
loadPhotos();
loadProductInfo();
</script>
</body>
</html>
