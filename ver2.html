<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OLENS 연예인 착용컷</title>
<style>
  :root{
    --bg:#FAF7F5; --ink:#2A2523; --ink-soft:#7A716C; --line:#E9E1DC;
    --accent:#C4707A; --accent-deep:#8F4A56; --accent-soft:#F2DCDF;
    --panel:#FFFFFF; --lens:#B9CFE0;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",-apple-system,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-tap-highlight-color: transparent;
  }
  #app{max-width:720px; margin:0 auto; min-height:100vh; background:var(--panel); display:flex; flex-direction:column;}

  #header{padding:28px 26px 18px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; align-items:center; text-align:center;}
  #header img{width:120px; margin-bottom:10px;}
  #header h1{font-size:16px; font-weight:700; margin-bottom:4px;}
  #header .sub{font-size:12px; color:var(--ink-soft);}

  #sync-status{margin:10px auto 0; font-size:10.5px; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  #sync-status .dot{width:7px; height:7px; border-radius:50%; background:#C9C0BB;}
  #sync-status.ok .dot{background:#6FAE7F;}
  #sync-status.err .dot{background:#C4707A;}

  #mode-tabs{display:flex; border-bottom:1px solid var(--line);}
  .mode-btn{flex:1; padding:13px 0; text-align:center; font-size:13px; font-weight:700; color:var(--ink-soft); background:var(--panel); border:none; cursor:pointer; border-bottom:2.5px solid transparent;}
  .mode-btn.active{color:var(--accent-deep); border-bottom-color:var(--accent); background:var(--accent-soft);}

  #search-wrap{padding:16px 26px; border-bottom:1px solid var(--line);}
  #search{width:100%; padding:11px 16px; border-radius:20px; border:1px solid var(--line); font-size:14px; background:var(--bg); color:var(--ink); outline:none;}
  #search:focus{border-color:var(--accent);}
  #count{font-size:11.5px; color:var(--ink-soft); margin-top:8px; display:block;}

  #list{flex:1; padding:8px 26px 40px;}
  .entry{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    padding:16px 4px; border-bottom:1px solid var(--line);
  }
  .entry .names{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .entry .celeb{font-size:15px; font-weight:800; color:var(--ink);}
  .entry .product{font-size:13px; color:var(--ink-soft);}
  .entry .go-btn{
    flex-shrink:0; display:flex; align-items:center; gap:6px;
    padding:9px 16px; border-radius:20px; background:var(--accent-soft); color:var(--accent-deep);
    font-size:12.5px; font-weight:700; text-decoration:none; white-space:nowrap;
    border:1px solid transparent; transition:background .12s ease;
  }
  .entry .go-btn:hover{background:var(--accent); color:#fff;}
  #empty{padding:60px 20px; text-align:center; color:var(--ink-soft); font-size:13px;}

  #footer-notice{
    margin:8px 26px 28px; padding:14px 16px; border-radius:12px;
    background:var(--accent-soft); border:1px solid #E7BFC4;
    color:var(--accent-deep); font-size:11.5px; line-height:1.6;
  }

  #disclaimer{
    padding:14px 26px 30px; font-size:10.5px; color:var(--ink-soft); line-height:1.6; text-align:center;
  }
</style>
</head>

    <h1>연예인 착용컷 모음</h1>
    <div class="sub">클릭하면 원본 인스타그램 게시물로 이동합니다</div>
    <div id="sync-status"><span class="dot"></span><span id="sync-text">불러오는 중...</span></div>
  </div>

  <div id="mode-tabs">
    <button class="mode-btn active" id="tab-celeb">연예인별</button>
    <button class="mode-btn" id="tab-product">제품별</button>
  </div>

  <div id="search-wrap">
    <input id="search" type="text" placeholder="연예인 또는 제품명 검색">
    <span id="count"></span>
  </div>

  <div id="list"></div>

  <div id="footer-notice">
    ※ 본 페이지는 고객 상담용 참고자료입니다. 매장 게시·SNS 업로드·인쇄물 제작 등 목적 외 사용을 금지합니다.
  </div>

  <div id="disclaimer">
    이 페이지는 이미지를 직접 저장·게시하지 않고, 각 연예인 착용컷의 원본 게시물(인스타그램)로 연결만 합니다.<br>
    이미지에 대한 권리는 각 원본 게시물 작성자 및 소속사에 있습니다.
  </div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwg1DzL7F-XuvJVHosQy5ZPpY0lvllu3EHd4b96PYrrym4syTbEcbMRpfIo_0w45EY/exec";
let ENTRIES = [];
let query = "";
let mode = "celeb"; // "celeb" | "product"

function setMode(m){
  mode = m;
  document.getElementById("tab-celeb").classList.toggle("active", m==="celeb");
  document.getElementById("tab-product").classList.toggle("active", m==="product");
  document.getElementById("search").placeholder = m==="celeb" ? "연예인 또는 제품명 검색" : "제품명 또는 연예인 검색";
  render();
}
document.getElementById("tab-celeb").onclick = () => setMode("celeb");
document.getElementById("tab-product").onclick = () => setMode("product");

async function loadEntries(){
  const statusEl = document.getElementById("sync-status");
  const textEl = document.getElementById("sync-text");
  try{
    const res = await fetch(API_URL + "?t=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("응답 오류: " + res.status);
    ENTRIES = await res.json();
    statusEl.className = "ok";
    textEl.textContent = `${ENTRIES.length}건 연결됨`;
  }catch(err){
    statusEl.className = "err";
    textEl.textContent = "연결 실패";
    console.error("시트 로드 실패", err);
  }
  render();
}

function render(){
  let items = ENTRIES.slice();
  if(query.trim()){
    const q = query.trim().toLowerCase();
    items = items.filter(e => (e.celeb + e.product).toLowerCase().includes(q));
  }
  if(mode === "celeb"){
    items.sort((a,b)=> a.celeb.localeCompare(b.celeb, 'ko'));
  }else{
    items.sort((a,b)=> (a.product||"").localeCompare(b.product||"", 'ko'));
  }

  document.getElementById("count").textContent = `${items.length}건`;

  const list = document.getElementById("list");
  list.innerHTML = "";
  if(items.length === 0){
    list.innerHTML = `<div id="empty">검색 결과가 없습니다.</div>`;
    return;
  }
  items.forEach(e=>{
    const primary = mode === "celeb" ? e.celeb : (e.product || "제품명 미입력");
    const secondary = mode === "celeb" ? (e.product || "") : e.celeb;
    const row = document.createElement("div");
    row.className = "entry";
    row.innerHTML = `
      <div class="names">
        <span class="celeb">${primary}</span>
        <span class="product">${secondary}</span>
      </div>
      <a class="go-btn" href="${e.url}">인스타그램 보기 →</a>`;
    list.appendChild(row);
  });
}

document.getElementById("search").addEventListener("input", (ev)=>{ query = ev.target.value; render(); });
loadEntries();
</script>
